# `gh release create --generate-notes` 가 이 설정으로 변경 목록을 분류합니다.
# 라벨이 없는 PR 은 "기타"로 들어가므로, PR 에 라벨만 붙여 두면 릴리스 노트가
# 자동으로 정리됩니다.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
    authors:
      - dependabot
      - github-actions

  categories:
    - title: 💥 호환성이 깨지는 변경
      labels: [breaking, breaking-change]

    # 아래 순서가 곧 우선순위입니다 — PR 이 여러 카테고리에 걸리면 **먼저 오는 쪽
    # 하나에만** 들어갑니다(`*` 설명이 "이전 카테고리에 매칭되지 않은" 이라고
    # 말하는 그 순차 매칭). 그래서 security·external-api 를 bug 앞에 둡니다.
    # 그러지 않으면 `bug` + `external-api` 를 붙인 PR 이 🐛 에만 들어가고
    # 🚄 는 영원히 비어 있게 됩니다.
    - title: 🔐 보안
      labels: [security]

    - title: 🚄 코레일 API 대응
      # 외부 API 변화 추종(엔드포인트·폼 필드·서명). 사용자에게 가장 중요한 축입니다.
      labels: [external-api]

    - title: ✨ 새 기능
      labels: [feature, enhancement]

    - title: 🐛 버그 수정
      labels: [bug, fix]

    - title: 📦 의존성
      labels: [dependencies]

    - title: 📝 문서
      labels: [documentation, docs]

    - title: 🧹 내부 정리
      labels: [refactor, chore, test, ci]

    - title: 기타
      labels: ["*"]
